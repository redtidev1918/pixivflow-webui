name: Release

# 全自动发版，无需 PAT/secret：master 上合入 release-worthy 提交后 release-please 在本
# 工作流内开/更发版 PR；发版 PR 合并后同一个 run 内构建多架构镜像推 GHCR 并建 Release。
# 内置 GITHUB_TOKEN 即可（同 run 内 job 不受「推 tag 不触发新工作流」限制）。
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要重跑/重发布的已有 tag（如 v1.0.2）；master push 自动发版时忽略
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    runs-on: ubuntu-latest
    needs: release-please
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/master' && needs.release-please.outputs.releases_created == 'true' ||
      startsWith(github.ref, 'refs/tags/')
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: imgtags
        run: |
          V="${RELEASE_TAG#v}"
          echo "plain=$V" >> "$GITHUB_OUTPUT"
          echo "vtag=v$V" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pixivflow-webui
          tags: |
            type=raw,value=${{ steps.imgtags.outputs.plain }}
            type=raw,value=${{ steps.imgtags.outputs.vtag }}
            type=raw,value=latest

      - name: Build and push amd64/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create/update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "pixivflow-webui $RELEASE_TAG" --generate-notes
          else
            gh release create "$RELEASE_TAG" --title "pixivflow-webui $RELEASE_TAG" \
              --notes "镜像 ghcr.io/redtidev1918/pixivflow-webui:${RELEASE_TAG#v}"
          fi
