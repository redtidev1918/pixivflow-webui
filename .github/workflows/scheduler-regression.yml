name: Scheduler regression

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npx jest src/__tests__/Scheduler.test.tsx --runInBand --silent
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/scheduler.spec.ts --project=chromium --workers=1 --reporter=list
