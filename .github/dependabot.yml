version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Shanghai
    labels: [dependencies]
    open-pull-requests-limit: 2
    ignore:
      # eslint 10 与 @typescript-eslint 6（peer ^7 || ^8）和 .eslintrc.json 都不兼容，
      # 自动升 major 会让 npm ci 直接失败。要升必须同批迁移到 flat config + typescript-eslint v8+。
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:30"
      timezone: Asia/Shanghai
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
