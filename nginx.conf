# PixivFlow WebUI 前端 nginx 配置模板。
# 启动时由 nginx 镜像入口对 ${UPSTREAM_API} 做 envsubst（见 Dockerfile / compose）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # REST API → PixivFlow WebUI 后端（52 个 /api/* 端点 + /api/health）
    location /api/ {
        proxy_pass ${UPSTREAM_API};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端 Basic Auth 的 Authorization 头原样透传
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        client_max_body_size 0;   # 体积限制交由后端（如 URL/文件上传）
    }

    # Socket.IO 实时通道（logs 日志流 / download 任务快照）
    location /socket.io/ {
        proxy_pass ${UPSTREAM_API};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 静态资源带缓存
    location ~* \.(js|css|png|jpe?g|gif|svg|webp|ico|woff2?|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
